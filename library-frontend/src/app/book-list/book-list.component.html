<div class="book-list-container">
  <div class="header-section">
    <h2>📚 Library Catalog</h2>
    <button class="btn-refresh" (click)="loadBooks()" [disabled]="isLoading">
      🔄 Refresh
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="state-box loading-box">
    <div class="spinner"></div>
    <p>Loading books from backend API...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage && !isLoading" class="state-box error-box">
    <p>⚠️ {{ errorMessage }}</p>
    <button class="btn-retry" (click)="loadBooks()">Try Again</button>
  </div>

  <!-- Data Table -->
  <div *ngIf="!isLoading && !errorMessage" class="table-wrapper">
    <table *ngIf="books.length > 0; else emptyState">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of books">
          <td>{{ book.id }}</td>
          <td class="book-title">{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td><span class="badge">{{ book.category }}</span></td>
          <td>
            <button class="btn-delete" (click)="deleteBook(book.id)">🗑️ Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <div class="empty-box">
        <p>No books available in the library yet. Add one using the form above!</p>
      </div>
    </ng-template>
  </div>
</div>
